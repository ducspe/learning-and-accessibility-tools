<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Narration voices · Learning and Accessibility Tools</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--fg:#1d2330;--muted:#5d6678;--line:#dde1e8;--acc:#e09400;--sec:#eef1f6}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d2129;--fg:#e8ebf1;--muted:#9aa3b5;--line:#2c323d;--acc:#ffb000;--sec:#191d24}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,sans-serif}
a{color:inherit;text-underline-offset:4px}.back{display:inline-block;margin-bottom:24px}a:focus-visible,audio:focus-visible{outline:3px solid #0877b8;outline-offset:4px}
main{max-width:860px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;margin:0 0 4px}p{color:var(--muted);margin:0 0 14px}
section{background:var(--sec);border:1px solid var(--line);border-radius:14px;padding:16px 16px 8px;margin:22px 0}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.row{display:grid;grid-template-columns:1fr 320px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.row.cur{border-color:var(--acc);border-width:2px}.name{font-weight:600}.meta{color:var(--muted);font-size:13px}
audio{width:100%}@media(max-width:620px){.row{grid-template-columns:1fr}}
</style></head><body><main>
<a class="back" href="../../index.html#example">Back to the video tutorial</a>
<h1>Narration voice samples</h1>
<p>Every sample reads the same passage from slide 2 (the LaTeX formula generator). German voices read a German translation of it and Romanian voices a Romanian translation. Highlighted voices narrate the current tutorial videos.</p>
<div id="list"></div>
</main><script>
// ["##", section title, section description] starts a section; ["#", title] is a language heading inside it.
const V=[
["##","Open-source voices (Piper)","Samples generated with the open-source Piper text-to-speech engine. The highlighted voices narrate the English, German, and Romanian tutorial videos."],
["#","English (US)"],
["01_en_US-lessac-high_CURRENT","lessac (high)","US English · female"],
["02_en_US-ryan-high","ryan (high)","US English · male"],
["03_en_US-ljspeech-high","ljspeech (high)","US English · female"],
["04_en_US-libritts-high_speaker0","libritts (high), speaker 0","US English · multi-speaker model"],
["05_en_US-libritts-high_speaker20","libritts (high), speaker 20","US English · multi-speaker model"],
["06_en_US-amy-medium","amy (medium)","US English · female"],
["07_en_US-joe-medium","joe (medium)","US English · male"],
["08_en_US-hfc_female-medium","hfc_female (medium)","US English · female · used in the English tutorial",1],
["#","English (British)"],
["09_en_GB-cori-high","cori (high)","British English · female"],
["10_en_GB-alan-medium","alan (medium)","British English · male"],
["11_en_GB-northern_english_male-medium","northern_english_male (medium)","British English · male"],
["#","German"],
["12_de_DE-thorsten-high_GERMAN","thorsten (high)","German · male · used in the German tutorial",1],
["13_de_DE-kerstin-medium_GERMAN","kerstin (medium)","German · female"],
["14_de_DE-thorsten_emotional-medium_neutral_GERMAN","thorsten_emotional (medium), neutral style","German · male · model with 8 speaking styles"],
["15_de_DE-thorsten_emotional-medium_amused_GERMAN","thorsten_emotional (medium), amused style","German · male · same model, different style"],
["16_de_DE-mls-medium_speaker3_GERMAN","mls (medium), speaker 3","German · multi-speaker model (236 speakers)"],
["17_de_DE-mls-medium_speaker10_GERMAN","mls (medium), speaker 10","German · multi-speaker model (236 speakers)"],
["#","Romanian"],
["18_ro_RO-mihai-medium_ROMANIAN","mihai (medium)","Romanian · male · used in the Romanian tutorial",1],
["##","ElevenLabs voices (cloud service)","Audio generated with <a href='https://elevenlabs.io/'>ElevenLabs (elevenlabs.io)</a> and shared for noncommercial comparison. The tutorial videos use Piper voices."],
["#","English"],
["EL_01_en_Alice_ENGLISH","Alice","British English · female · ElevenLabs built-in voice (“Clear, Engaging Educator”)"],
["EL_02_en_Wren_ENGLISH","Wren","American English · female · community library voice (“Warm Conversational Instructor”)"],
["EL_03_en_Dean_ENGLISH","Dean","American English · male · community library voice (“Clear, Patient & Engaging”)"],
["#","German"],
["EL_04_de_Toni_GERMAN","Toni","German · female · community library voice (“Klar & Engagiert Bildungsstimme”)"],
["EL_05_de_Andreas_GERMAN","Andreas","German · community library voice (“E-Learning”: “Deutlich, klar, verständlich”)"],
["#","Romanian"],
["EL_06_ro_Alexa_ROMANIAN","Alexa","Romanian · female · community library voice (warm timbre, clear diction)"],
["EL_07_ro_Antonio_ROMANIAN","Antonio","Romanian · male · community library voice (“Deep, Confident Narrator” for explainers and e-learning)"]];
const code=f=>f.startsWith("EL_")?"ElevenLabs · eleven_multilingual_v2"
  :f.replace(/^\d+_/,"").replace(/_(CURRENT|GERMAN|ROMANIAN)$/,"").replace(/_(neutral|amused|speaker\d+)$/,"");
const row=([f,n,m,c])=>`<div class="row${c?" cur":""}"><div><div class="name">${n}</div><div class="meta">${m} · <code>${code(f)}</code></div></div><audio controls preload="none" aria-label="Listen to ${n}: ${m}" src="${f}.mp3"></audio></div>`;
let html="",open=false;
for(const e of V){
  if(e[0]==="##"){ if(open) html+="</section>"; html+=`<section><h2>${e[1]}</h2><p>${e[2]}</p>`; open=true; }
  else if(e[0]==="#") html+=`<h3>${e[1]}</h3>`;
  else html+=row(e);
}
document.getElementById("list").innerHTML=html+(open?"</section>":"");
document.addEventListener("play",e=>document.querySelectorAll("audio").forEach(a=>a!==e.target&&a.pause()),true);
</script></body></html>
